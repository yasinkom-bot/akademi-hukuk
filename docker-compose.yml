version: '3.8'

services:
  db:
    image: postgres:15
    container_name: akademi_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: akademi_hukuk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups

  app:
    build: .
    container_name: akademi_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:password@db:5432/akademi_hukuk?schema=public"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups

volumes:
  pgdata:
